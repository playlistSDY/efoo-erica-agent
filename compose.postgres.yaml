# Use with compose.yaml. Set POSTGRES_PASSWORD in .env before starting.
services:
  web:
    environment:
      DATABASE_URL: postgresql://efoo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/efoo
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: efoo
      POSTGRES_USER: efoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efoo -d efoo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
